[[pre-start]]
copy-ignored = "wt step copy-ignored --require-include"

[[pre-start]]
environment = "just env-init"

[[pre-start]]
install-deps = "bun install"
database = "just dev-db-up"

[[pre-start]]
schema = "just schema-apply"

[post-start]
server = "wt step tether -- just dev"

[pre-remove]
database = "just dev-db-destroy"

[list]
url = "http://localhost:{{ (repo ~ '-app-' ~ branch) | hash_port }}"
