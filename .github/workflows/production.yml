name: Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      revision:
        description: Commit, branch, or tag to deploy
        required: true
        default: master
        type: string
      apply_migrations:
        description: Apply pending database migrations before deploying the revision
        required: true
        default: false
        type: boolean
      restart_database:
        description: Recreate PostgreSQL to reload database and WAL archive configuration
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  resolve:
    name: Resolve revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      postgres_tag: ${{ steps.revision.outputs.postgres_tag }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Record commit SHA
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "postgres_tag=$(git rev-parse HEAD:docker/postgres-walg)" >> "$GITHUB_OUTPUT"

  quality:
    name: CI
    if: github.event_name == 'workflow_dispatch'
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.resolve.outputs.sha }}

  publish:
    name: Publish production images
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (github.event_name == 'push' || needs.quality.result == 'success')
    needs:
      - resolve
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing application image
        id: application_image
        run: |
          if docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/streambrew:${{ needs.resolve.outputs.sha }}" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish application image
        if: steps.application_image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/streambrew:${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application,timeout=1m,ignore-error=true

      - name: Check for existing PostgreSQL WAL-G image
        id: postgres_image
        run: |
          if docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/streambrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish PostgreSQL WAL-G image
        if: steps.postgres_image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/postgres-walg
          file: docker/postgres-walg/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/streambrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=postgres-walg
          cache-to: type=gha,mode=max,scope=postgres-walg,timeout=1m,ignore-error=true

  deploy:
    name: Apply production Terraform
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.publish.result == 'success'
    needs:
      - resolve
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    environment:
      name: Production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/streambrew:${{ needs.resolve.outputs.sha }}
      DEPLOY_PATH: ${{ vars.SSH_DEPLOY_PATH }}
      POSTGRES_IMAGE: ghcr.io/${{ github.repository_owner }}/streambrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}
      REMOTE_ENV_FILE: .streambrew-production-env-${{ github.run_id }}-${{ github.run_attempt }}
      REMOTE_AXIOM_FILE: .streambrew-axiom-token-${{ github.run_id }}-${{ github.run_attempt }}
      APPLY_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations || false }}
      AWS_LIGHTSAIL_INSTANCE_NAME: ${{ vars.AWS_LIGHTSAIL_INSTANCE_NAME || 'Ubuntu-1' }}
      AWS_PROJECT_NAME: ${{ vars.AWS_PROJECT_NAME || 'streambrew' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      RESTART_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.restart_database || false }}
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_VAR_application_image: ghcr.io/${{ github.repository_owner }}/streambrew:${{ needs.resolve.outputs.sha }}
      TF_VAR_application_revision: ${{ needs.resolve.outputs.sha }}
      TF_VAR_axiom_token_path: ${{ vars.SSH_DEPLOY_PATH }}/axiom_token
      TF_VAR_deployment_nonce: ${{ github.run_id }}-${{ github.run_attempt }}
      TF_VAR_docker_host: ssh://streambrew-production
      TF_VAR_postgres_image: ghcr.io/${{ github.repository_owner }}/streambrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}
      TF_VAR_postgres_public_port: ${{ vars.PGPORT || '5432' }}
      TF_VAR_runtime_config_path: ${{ vars.SSH_DEPLOY_PATH }}/runtime.env
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: streambrew-${{ github.run_id }}

      - name: Discover the Lightsail production host
        run: |
          set -euo pipefail

          instance_state="$(aws lightsail get-instance-state \
            --instance-name "$AWS_LIGHTSAIL_INSTANCE_NAME" \
            --query 'state.name' \
            --output text)"
          if [[ "$instance_state" != running ]]; then
            echo "Expected Lightsail instance $AWS_LIGHTSAIL_INSTANCE_NAME to be running, got: $instance_state" >&2
            exit 1
          fi

          public_ip="$(aws lightsail get-instance \
            --instance-name "$AWS_LIGHTSAIL_INSTANCE_NAME" \
            --query 'instance.publicIpAddress' \
            --output text)"
          if [[ -z "$public_ip" || "$public_ip" == None ]]; then
            echo "Lightsail did not return a public IP for $AWS_LIGHTSAIL_INSTANCE_NAME" >&2
            exit 1
          fi

          {
            echo "SSH_HOST=$public_ip"
            echo "SSH_PORT=22"
            echo "SSH_USER=ubuntu"
            echo "WALG_S3_PREFIX=${{ vars.WALG_S3_PREFIX }}"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/deploy_key"

          cat > "$HOME/.ssh/config" <<SSH_CONFIG
          Host streambrew-production
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            HostKeyAlias streambrew-production
            IdentityFile $RUNNER_TEMP/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ControlMaster auto
            ControlPath $RUNNER_TEMP/ssh-%C
            ControlPersist 10m
            ServerAliveInterval 30
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
          SSH_CONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Pull immutable production images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'ssh streambrew-production docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | ssh streambrew-production \
            docker login ghcr.io --username '${{ github.actor }}' --password-stdin
          ssh streambrew-production sh -s -- "$APP_IMAGE" "$POSTGRES_IMAGE" <<'REMOTE'
          set -eu
          docker pull "$1"
          docker pull "$2"
          docker pull caddy:2.10.2-alpine
          docker pull nats:2.11.17-alpine
          docker pull timberio/vector:0.58.0-alpine
          REMOTE

      - name: Generate and upload production environment
        env:
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BOOSTY_CLIENT_ID: ${{ vars.BOOSTY_CLIENT_ID }}
          BOOSTY_CLIENT_SECRET: ${{ secrets.BOOSTY_CLIENT_SECRET }}
          CHAT_SERVICE_SECRET: ${{ secrets.CHAT_SERVICE_SECRET }}
          CHAT_TOKEN_ENCRYPTION_SECRET: ${{ secrets.CHAT_TOKEN_ENCRYPTION_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
          DONATION_ALERTS_CLIENT_ID: ${{ vars.DONATION_ALERTS_CLIENT_ID }}
          DONATION_ALERTS_CLIENT_SECRET: ${{ secrets.DONATION_ALERTS_CLIENT_SECRET }}
          STREAMLABS_CLIENT_ID: ${{ vars.STREAMLABS_CLIENT_ID }}
          STREAMLABS_CLIENT_SECRET: ${{ secrets.STREAMLABS_CLIENT_SECRET }}
          DONATIONS_SERVICE_SECRET: ${{ secrets.DONATIONS_SERVICE_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KICK_CLIENT_ID: ${{ vars.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          KICK_WEBHOOK_PUBLIC_KEY: ${{ vars.KICK_WEBHOOK_PUBLIC_KEY }}
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VK_VIDEO_CLIENT_ID: ${{ vars.VK_VIDEO_CLIENT_ID }}
          VK_VIDEO_CLIENT_SECRET: ${{ secrets.VK_VIDEO_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          PGDATABASE: ${{ vars.PGDATABASE }}
          PGHOST: ${{ vars.PGHOST }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: ${{ vars.PGPORT }}
          PGUSER: ${{ vars.PGUSER }}
          WALG_ARCHIVE_TIMEOUT_SECONDS: ${{ vars.WALG_ARCHIVE_TIMEOUT_SECONDS }}
          WALG_BACKUP_INTERVAL_SECONDS: ${{ vars.WALG_BACKUP_INTERVAL_SECONDS }}
          WALG_KEEP_FULL_BACKUPS: ${{ vars.WALG_KEEP_FULL_BACKUPS }}
        run: |
          node --input-type=module - "$RUNNER_TEMP/production.env" <<'NODE'
          import { writeFileSync } from "node:fs"

          const outputPath = process.argv[2]
          const required = [
            "YOUTUBE_API_KEY",
            "APP_DOMAIN",
            "AWS_REGION",
            "BETTER_AUTH_SECRET",
            "CHAT_SERVICE_SECRET",
            "CHAT_TOKEN_ENCRYPTION_SECRET",
            "TELEGRAM_BOT_TOKEN",
            "DONATION_ALERTS_CLIENT_ID",
            "DONATION_ALERTS_CLIENT_SECRET",
            "STREAMLABS_CLIENT_ID",
            "STREAMLABS_CLIENT_SECRET",
            "DONATIONS_SERVICE_SECRET",
            "GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET",
            "PGDATABASE",
            "PGHOST",
            "PGPASSWORD",
            "PGUSER",
            "WALG_S3_PREFIX",
          ]
          const optional = [
            "TELEGRAM_ADMIN_CHAT_ID",
            "ADMIN_EMAILS",
            "AWS_ACCESS_KEY_ID",
            "AWS_ENDPOINT",
            "AWS_SECRET_ACCESS_KEY",
            "AWS_SESSION_TOKEN",
            "BOOSTY_CLIENT_ID",
            "BOOSTY_CLIENT_SECRET",
            "KICK_CLIENT_ID",
            "KICK_CLIENT_SECRET",
            "KICK_WEBHOOK_PUBLIC_KEY",
            "PGPORT",
            "TWITCH_CLIENT_ID",
            "TWITCH_CLIENT_SECRET",
            "VK_VIDEO_CLIENT_ID",
            "VK_VIDEO_CLIENT_SECRET",
            "WALG_ARCHIVE_TIMEOUT_SECONDS",
            "WALG_BACKUP_INTERVAL_SECONDS",
            "WALG_KEEP_FULL_BACKUPS",
            "YOUTUBE_CLIENT_ID",
            "YOUTUBE_CLIENT_SECRET",
          ]
          const missing = required.filter((name) => !process.env[name])

          if (missing.length > 0) {
            throw new Error(`Missing GitHub production configuration: ${missing.join(", ")}`)
          }
          if (!process.env.AXIOM_TOKEN) {
            throw new Error("Missing GitHub production configuration: AXIOM_TOKEN")
          }
          if (process.env.PGHOST !== "postgres") {
            throw new Error("PGHOST must be the Terraform network alias: postgres")
          }

          const hasAccessKey = Boolean(process.env.AWS_ACCESS_KEY_ID)
          const hasSecretKey = Boolean(process.env.AWS_SECRET_ACCESS_KEY)
          if (hasAccessKey !== hasSecretKey) {
            throw new Error(
              "AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must either both be set or both be omitted",
            )
          }
          if (process.env.AWS_SESSION_TOKEN && !hasAccessKey) {
            throw new Error("AWS_SESSION_TOKEN requires the WAL-G access-key pair")
          }

          const optionalGroups = [
            ["BOOSTY_CLIENT_ID", "BOOSTY_CLIENT_SECRET"],
            ["KICK_CLIENT_ID", "KICK_CLIENT_SECRET", "KICK_WEBHOOK_PUBLIC_KEY"],
            ["TWITCH_CLIENT_ID", "TWITCH_CLIENT_SECRET"],
            ["VK_VIDEO_CLIENT_ID", "VK_VIDEO_CLIENT_SECRET"],
            ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET"],
          ]
          for (const group of optionalGroups) {
            const configured = group.filter((name) => process.env[name])
            if (configured.length > 0 && configured.length < group.length) {
              throw new Error(`${group.join(", ")} must either all be set or all be omitted`)
            }
          }

          const encodeUrlPart = (value) => encodeURIComponent(value)
          const databaseUrl =
            `postgresql://${encodeUrlPart(process.env.PGUSER)}:` +
            `${encodeUrlPart(process.env.PGPASSWORD)}@${encodeUrlPart(process.env.PGHOST)}:5432/` +
            encodeUrlPart(process.env.PGDATABASE)
          const values = {
            ...Object.fromEntries(required.map((name) => [name, process.env[name]])),
            ...Object.fromEntries(
              optional.filter((name) => process.env[name]).map((name) => [name, process.env[name]]),
            ),
            DATABASE_URL: databaseUrl,
          }
          const quote = (value) => `'${value.replaceAll("'", "'\\''")}'`
          const contents = Object.entries(values)
            .map(([name, value]) => `${name}=${quote(value)}`)
            .join("\n")

          writeFileSync(outputPath, `${contents}\n`, { encoding: "utf8", mode: 0o600 })
          NODE

          printf '%s' "$AXIOM_TOKEN" > "$RUNNER_TEMP/axiom_token"
          chmod 600 "$RUNNER_TEMP/production.env" "$RUNNER_TEMP/axiom_token"
          scp "$RUNNER_TEMP/production.env" "streambrew-production:$REMOTE_ENV_FILE"
          scp "$RUNNER_TEMP/axiom_token" "streambrew-production:$REMOTE_AXIOM_FILE"

          ssh streambrew-production bash -s -- \
            "$DEPLOY_PATH" \
            "$REMOTE_ENV_FILE" \
            "$REMOTE_AXIOM_FILE" <<'REMOTE'
          set -euo pipefail

          deploy_path="$1"
          production_env="$HOME/$2"
          axiom_token="$HOME/$3"

          if [[ ! -f "$production_env" ]]; then
            echo "The uploaded production environment file is unavailable." >&2
            exit 1
          fi
          if [[ ! -f "$axiom_token" ]]; then
            echo "The uploaded Axiom token is unavailable." >&2
            exit 1
          fi

          install -d -m 750 "$deploy_path"
          install -m 640 "$production_env" "$deploy_path/runtime.env.next"
          install -m 640 "$axiom_token" "$deploy_path/axiom_token.next"
          mv "$deploy_path/runtime.env.next" "$deploy_path/runtime.env"
          mv "$deploy_path/axiom_token.next" "$deploy_path/axiom_token"
          rm -f "$production_env" "$axiom_token"

          command -v docker >/dev/null
          docker info >/dev/null
          id -g
          REMOTE

          runtime_gid="$(ssh streambrew-production id -g)"
          echo "TF_VAR_runtime_secrets_gid=$runtime_gid" >> "$GITHUB_ENV"

      - name: Apply Terraform and verify release
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          terraform_state() {
            terraform "$@"
          }

          terraform_init() {
            terraform_state -chdir=infra/production init \
              -input=false \
              -reconfigure \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="key=$AWS_PROJECT_NAME/production.tfstate" \
              -backend-config="region=$TF_STATE_REGION" \
              -backend-config="encrypt=true" \
              -backend-config="use_lockfile=true"
          }

          terraform_init

          previous_revision="$(terraform_state -chdir=infra/production output -raw application_revision 2>/dev/null || true)"
          previous_app_image="$(terraform_state -chdir=infra/production output -raw application_image 2>/dev/null || true)"
          previous_postgres_image="$(terraform_state -chdir=infra/production output -raw postgres_image 2>/dev/null || true)"

          migrations_changed=true
          if [[ -n "$previous_revision" ]] && git diff --quiet "$previous_revision" "$TARGET_SHA" -- db/migrations; then
            migrations_changed=false
          fi

          if [[ "$migrations_changed" == true && "$APPLY_MIGRATIONS" != true ]]; then
            if [[ -z "$previous_revision" ]]; then
              echo "Bootstrapping PostgreSQL before the initial migration run."
              terraform_state -chdir=infra/production plan \
                -input=false \
                -target=docker_container.postgres \
                -out="$RUNNER_TEMP/database-bootstrap.tfplan"
              terraform_state -chdir=infra/production apply \
                -input=false \
                -auto-approve \
                "$RUNNER_TEMP/database-bootstrap.tfplan"
            fi
            echo "db/migrations differs from the deployed Terraform state." >&2
            echo "Review the migrations, then run this workflow for $TARGET_SHA" >&2
            echo "with apply_migrations=true." >&2
            exit 42
          fi

          if [[ "$migrations_changed" == true ]]; then
            terraform_state -chdir=infra/production plan \
              -input=false \
              -target=docker_container.postgres \
              -out="$RUNNER_TEMP/migration-prerequisites.tfplan"
            terraform_state -chdir=infra/production apply \
              -input=false \
              -auto-approve \
              "$RUNNER_TEMP/migration-prerequisites.tfplan"

            if [[ -n "$previous_revision" ]]; then
              ssh streambrew-production docker stop coldbrew-web-1 coldbrew-video-1 >/dev/null
            fi

            if ! ssh streambrew-production docker run \
              --rm \
              --network coldbrew_internal \
              --group-add "$TF_VAR_runtime_secrets_gid" \
              --mount "type=bind,source=$TF_VAR_runtime_config_path,target=/run/streambrew/runtime.env,readonly" \
              --entrypoint /bin/sh \
              "$APP_IMAGE" \
              -c 'set -a; . /run/streambrew/runtime.env; set +a; export DBMATE_NO_DUMP_SCHEMA=true; exec bunx dbmate --migrations-dir /app/db/migrations up'; then
              if [[ -n "$previous_revision" ]]; then
                ssh streambrew-production docker start coldbrew-web-1 coldbrew-video-1 >/dev/null
              fi
              exit 1
            fi
          fi

          plan_options=()
          if [[ "$RESTART_DATABASE" == true ]]; then
            plan_options+=("-replace=docker_container.postgres")
          fi

          deployment_succeeded=true
          if ! terraform_state -chdir=infra/production plan \
            -input=false \
            "${plan_options[@]}" \
            -out="$RUNNER_TEMP/production.tfplan"; then
            deployment_succeeded=false
          fi

          if [[ "$deployment_succeeded" == true ]] && ! terraform_state \
            -chdir=infra/production apply \
              -input=false \
              -auto-approve \
              "$RUNNER_TEMP/production.tfplan"; then
            deployment_succeeded=false
          fi

          if [[ "$deployment_succeeded" == true ]] && ! ssh streambrew-production \
            docker inspect --format '{{.Name}} {{.State.Running}}' \
              coldbrew-postgres-1 coldbrew-wal-g-1 coldbrew-nats-1 coldbrew-chat-1 \
              coldbrew-donations-1 coldbrew-video-1 coldbrew-alerts-1 coldbrew-web-1 \
              coldbrew-caddy-1 coldbrew-vector-1 | awk '$2 != "true" { exit 1 }'; then
            deployment_succeeded=false
          fi

          if [[ "$deployment_succeeded" == true ]] && ! curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            "${APP_DOMAIN%/}/api/health" >/dev/null; then
            deployment_succeeded=false
          fi

          if [[ "$deployment_succeeded" == true ]]; then
            status="$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${APP_DOMAIN%/}/api/chat/deployment-routing-probe")"
            if [[ "$status" != 404 ]]; then
              echo "Public /api/chat route bypasses web: expected HTTP 404, got $status" >&2
              deployment_succeeded=false
            fi
          fi

          if [[ "$deployment_succeeded" == true ]]; then
            exit 0
          fi

          echo "Terraform deployment or release verification failed." >&2
          if [[ -z "$previous_revision" || -z "$previous_app_image" || -z "$previous_postgres_image" ]]; then
            echo "No previous Terraform release is available for automatic rollback." >&2
            exit 1
          fi

          echo "Rolling production back to $previous_revision." >&2
          (
            trap 'ssh streambrew-production docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "$GHCR_TOKEN" | ssh streambrew-production \
              docker login ghcr.io --username '${{ github.actor }}' --password-stdin
            ssh streambrew-production sh -s -- \
              "$previous_app_image" "$previous_postgres_image" <<'REMOTE'
          set -eu
          docker pull "$1"
          docker pull "$2"
          REMOTE
          )
          TF_VAR_application_revision="$previous_revision" \
          TF_VAR_application_image="$previous_app_image" \
          TF_VAR_postgres_image="$previous_postgres_image" \
            terraform_state -chdir=infra/production plan \
              -input=false \
              -out="$RUNNER_TEMP/rollback.tfplan"
          TF_VAR_application_revision="$previous_revision" \
          TF_VAR_application_image="$previous_app_image" \
          TF_VAR_postgres_image="$previous_postgres_image" \
            terraform_state -chdir=infra/production apply \
              -input=false \
              -auto-approve \
              "$RUNNER_TEMP/rollback.tfplan"
          exit 1

      - name: Remove transient uploads
        if: always()
        continue-on-error: true
        run: |
          ssh streambrew-production bash -s -- "$REMOTE_ENV_FILE" "$REMOTE_AXIOM_FILE" <<'REMOTE'
          set -euo pipefail
          rm -f "$HOME/$1" "$HOME/$2"
          REMOTE
