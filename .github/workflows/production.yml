name: Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      revision:
        description: Commit, branch, or tag to deploy
        required: true
        default: master
        type: string
      migrations_applied:
        description: Confirm that pending database migrations were applied manually
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  resolve:
    name: Resolve revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      postgres_tag: ${{ steps.revision.outputs.postgres_tag }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Record commit SHA
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "postgres_tag=$(git rev-parse HEAD:docker/postgres-walg)" >> "$GITHUB_OUTPUT"

  quality:
    name: CI
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.resolve.outputs.sha }}

  publish:
    name: Publish production images
    needs:
      - resolve
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coldbrew:${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

      - name: Check for existing PostgreSQL WAL-G image
        id: postgres_image
        run: |
          if docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/coldbrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish PostgreSQL WAL-G image
        if: steps.postgres_image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/postgres-walg
          file: docker/postgres-walg/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coldbrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=postgres-walg
          cache-to: type=gha,mode=max,scope=postgres-walg

  deploy:
    name: Deploy to VPS
    needs:
      - resolve
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: Production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/coldbrew:${{ needs.resolve.outputs.sha }}
      DEPLOY_PATH: ${{ vars.SSH_DEPLOY_PATH }}
      POSTGRES_IMAGE: ghcr.io/${{ github.repository_owner }}/coldbrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}
      REMOTE_ENV_FILE: .coldbrew-production-env-${{ github.run_id }}-${{ github.run_attempt }}
      MIGRATIONS_APPLIED: ${{ github.event_name == 'workflow_dispatch' && inputs.migrations_applied || false }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/deploy_key"

      - name: Generate and upload production environment
        env:
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BOOSTY_CLIENT_ID: ${{ vars.BOOSTY_CLIENT_ID }}
          BOOSTY_CLIENT_SECRET: ${{ secrets.BOOSTY_CLIENT_SECRET }}
          CHAT_SERVICE_SECRET: ${{ secrets.CHAT_SERVICE_SECRET }}
          CHAT_TOKEN_ENCRYPTION_SECRET: ${{ secrets.CHAT_TOKEN_ENCRYPTION_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
          DONATION_ALERTS_CLIENT_ID: ${{ vars.DONATION_ALERTS_CLIENT_ID }}
          DONATION_ALERTS_CLIENT_SECRET: ${{ secrets.DONATION_ALERTS_CLIENT_SECRET }}
          DONATIONS_SERVICE_SECRET: ${{ secrets.DONATIONS_SERVICE_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KICK_CLIENT_ID: ${{ vars.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          KICK_WEBHOOK_PUBLIC_KEY: ${{ vars.KICK_WEBHOOK_PUBLIC_KEY }}
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VK_VIDEO_CLIENT_ID: ${{ vars.VK_VIDEO_CLIENT_ID }}
          VK_VIDEO_CLIENT_SECRET: ${{ secrets.VK_VIDEO_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          PGDATABASE: ${{ vars.PGDATABASE }}
          PGHOST: ${{ vars.PGHOST }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: ${{ vars.PGPORT }}
          PGUSER: ${{ vars.PGUSER }}
          WALG_ARCHIVE_TIMEOUT_SECONDS: ${{ vars.WALG_ARCHIVE_TIMEOUT_SECONDS }}
          WALG_BACKUP_INTERVAL_SECONDS: ${{ vars.WALG_BACKUP_INTERVAL_SECONDS }}
          WALG_KEEP_FULL_BACKUPS: ${{ vars.WALG_KEEP_FULL_BACKUPS }}
          WALG_S3_PREFIX: ${{ vars.WALG_S3_PREFIX }}
        run: |
          node --input-type=module - "$RUNNER_TEMP/production.env" <<'NODE'
          import { writeFileSync } from "node:fs"

          const outputPath = process.argv[2]
          const required = [
            "YOUTUBE_API_KEY",
            "APP_DOMAIN",
            "AWS_REGION",
            "AXIOM_TOKEN",
            "BETTER_AUTH_SECRET",
            "CHAT_SERVICE_SECRET",
            "CHAT_TOKEN_ENCRYPTION_SECRET",
            "TELEGRAM_BOT_TOKEN",
            "DONATION_ALERTS_CLIENT_ID",
            "DONATION_ALERTS_CLIENT_SECRET",
            "DONATIONS_SERVICE_SECRET",
            "GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET",
            "PGDATABASE",
            "PGHOST",
            "PGPASSWORD",
            "PGUSER",
            "WALG_S3_PREFIX",
          ]
          const optional = [
            "TELEGRAM_ADMIN_CHAT_ID",
            "ADMIN_EMAILS",
            "AWS_ACCESS_KEY_ID",
            "AWS_ENDPOINT",
            "AWS_SECRET_ACCESS_KEY",
            "AWS_SESSION_TOKEN",
            "BOOSTY_CLIENT_ID",
            "BOOSTY_CLIENT_SECRET",
            "KICK_CLIENT_ID",
            "KICK_CLIENT_SECRET",
            "KICK_WEBHOOK_PUBLIC_KEY",
            "PGPORT",
            "TWITCH_CLIENT_ID",
            "TWITCH_CLIENT_SECRET",
            "VK_VIDEO_CLIENT_ID",
            "VK_VIDEO_CLIENT_SECRET",
            "WALG_ARCHIVE_TIMEOUT_SECONDS",
            "WALG_BACKUP_INTERVAL_SECONDS",
            "WALG_KEEP_FULL_BACKUPS",
            "YOUTUBE_CLIENT_ID",
            "YOUTUBE_CLIENT_SECRET",
          ]
          const missing = required.filter((name) => !process.env[name])

          if (missing.length > 0) {
            throw new Error(`Missing GitHub production configuration: ${missing.join(", ")}`)
          }

          const hasAccessKey = Boolean(process.env.AWS_ACCESS_KEY_ID)
          const hasSecretKey = Boolean(process.env.AWS_SECRET_ACCESS_KEY)
          if (hasAccessKey !== hasSecretKey) {
            throw new Error(
              "AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must either both be set or both be omitted",
            )
          }

          const optionalGroups = [
            ["BOOSTY_CLIENT_ID", "BOOSTY_CLIENT_SECRET"],
            ["KICK_CLIENT_ID", "KICK_CLIENT_SECRET", "KICK_WEBHOOK_PUBLIC_KEY"],
            ["TWITCH_CLIENT_ID", "TWITCH_CLIENT_SECRET"],
            ["VK_VIDEO_CLIENT_ID", "VK_VIDEO_CLIENT_SECRET"],
            ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET"],
          ]
          for (const group of optionalGroups) {
            const configured = group.filter((name) => process.env[name])
            if (configured.length > 0 && configured.length < group.length) {
              throw new Error(`${group.join(", ")} must either all be set or all be omitted`)
            }
          }

          const encodeUrlPart = (value) => encodeURIComponent(value)
          const databaseUrl =
            `postgresql://${encodeUrlPart(process.env.PGUSER)}:` +
            `${encodeUrlPart(process.env.PGPASSWORD)}@${encodeUrlPart(process.env.PGHOST)}:5432/` +
            encodeUrlPart(process.env.PGDATABASE)
          const values = {
            ...Object.fromEntries(required.map((name) => [name, process.env[name]])),
            ...Object.fromEntries(
              optional.filter((name) => process.env[name]).map((name) => [name, process.env[name]]),
            ),
            DATABASE_URL: databaseUrl,
          }
          const quote = (value) => `'${value.replaceAll("'", "\\'")}'`
          const contents = Object.entries(values)
            .map(([name, value]) => `${name}=${quote(value)}`)
            .join("\n")

          writeFileSync(outputPath, `${contents}\n`, { encoding: "utf8", mode: 0o600 })
          NODE

          scp \
            -i "$RUNNER_TEMP/deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/production.env" \
            "$SSH_USER@$SSH_HOST:$REMOTE_ENV_FILE"

      - name: Deploy immutable images
        run: |
          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- \
              "$DEPLOY_PATH" \
              "$TARGET_SHA" \
              "$APP_IMAGE" \
              "$POSTGRES_IMAGE" \
              "$MIGRATIONS_APPLIED" \
              "$REMOTE_ENV_FILE" <<'REMOTE'
          set -euo pipefail

          deploy_path="$1"
          target_sha="$2"
          app_image="$3"
          postgres_image="$4"
          migrations_applied="$5"
          production_env="$HOME/$6"

          cleanup() {
            rm -f "$production_env" "$deploy_path/.env.next"
          }
          trap cleanup EXIT

          export PATH="$HOME/.local/bin:$HOME/.bun/bin:$HOME/.cargo/bin:/usr/local/bin:$PATH"

          for command_name in git docker just bunx curl; do
            if ! command -v "$command_name" >/dev/null 2>&1; then
              echo "Required production command is unavailable: $command_name" >&2
              echo "Install it for the SSH user or place it in a standard user bin directory." >&2
              exit 127
            fi
          done
          docker compose version >/dev/null

          if [[ ! -f "$production_env" ]]; then
            echo "The uploaded production environment file is unavailable." >&2
            exit 1
          fi

          required_env=(
            YOUTUBE_API_KEY
            APP_DOMAIN
            PGDATABASE
            PGUSER
            PGPASSWORD
            DATABASE_URL
            AXIOM_TOKEN
            BETTER_AUTH_SECRET
            CHAT_SERVICE_SECRET
            CHAT_TOKEN_ENCRYPTION_SECRET
            TELEGRAM_BOT_TOKEN
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            DONATION_ALERTS_CLIENT_ID
            DONATION_ALERTS_CLIENT_SECRET
            DONATIONS_SERVICE_SECRET
            WALG_S3_PREFIX
            AWS_REGION
          )
          bunx dotenvx run -f "$production_env" --overload -- \
            bash -c '
              for name in "$@"; do
                if [[ -z "${!name:-}" ]]; then
                  echo "Generated production environment is missing required value: $name" >&2
                  exit 1
                fi
              done
            ' bash "${required_env[@]}"

          cd "$deploy_path"

          install -m 600 "$production_env" .env.next
          mv .env.next .env

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "The production checkout has tracked local changes; refusing to overwrite them." >&2
            exit 1
          fi

          git fetch --quiet --prune --tags origin
          git cat-file -e "${target_sha}^{commit}"

          previous_sha=""
          if [[ -f .deployed-sha ]]; then
            read -r previous_sha < .deployed-sha
            git cat-file -e "${previous_sha}^{commit}"
          fi

          migrations_changed=true
          if [[ -n "$previous_sha" ]] && git diff --quiet "$previous_sha" "$target_sha" -- db/migrations; then
            migrations_changed=false
          fi

          if [[ "$migrations_changed" == true && "$migrations_applied" != true ]]; then
            echo "db/migrations differs from the deployed revision." >&2
            echo "Apply the target migrations on the VPS, then manually run this workflow" >&2
            echo "for revision $target_sha with migrations_applied=true." >&2
            exit 42
          fi

          git checkout --quiet --detach "$target_sha"

          # Schema transitions must not mix old web readers with new workers.
          # Pull first to keep the coordinated application pause short.
          if [[ "$migrations_changed" == true ]]; then
            docker pull "$app_image"
            docker compose stop web video
          fi

          if just production-deploy "$app_image" "$postgres_image"; then
            printf '%s\n' "$target_sha" > .deployed-sha
            exit 0
          fi

          echo "Deployment failed health checks." >&2
          if [[ -n "$previous_sha" ]]; then
            echo "Rolling application containers back to $previous_sha." >&2
            git checkout --quiet --detach "$previous_sha"
            previous_postgres_tag="$(git rev-parse "${previous_sha}:docker/postgres-walg")"
            just production-deploy \
              "ghcr.io/lebedev-nikita/coldbrew:${previous_sha}" \
              "ghcr.io/lebedev-nikita/coldbrew-postgres-walg:${previous_postgres_tag}" || \
              echo "Automatic rollback also failed; inspect the VPS immediately." >&2
          else
            echo "No previous CI/CD deployment is recorded; automatic rollback is unavailable." >&2
          fi
          exit 1
          REMOTE

      - name: Remove uploaded environment file
        if: always()
        continue-on-error: true
        run: |
          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$REMOTE_ENV_FILE" <<'REMOTE'
          set -euo pipefail
          rm -f "$HOME/$1"
          REMOTE
