name: Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      revision:
        description: Commit, branch, or tag to deploy
        required: true
        default: master
        type: string
      schema_applied:
        description: Confirm that db/schema.sql was applied manually
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  resolve:
    name: Resolve revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      postgres_tag: ${{ steps.revision.outputs.postgres_tag }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Record commit SHA
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "postgres_tag=$(git rev-parse HEAD:docker/postgres-walg)" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality checks
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_DOMAIN: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      DATABASE_URL: postgresql://coldbrew:coldbrew@127.0.0.1:5432/coldbrew
      DONATION_ALERTS_CLIENT_ID: "1"
      DONATION_ALERTS_CLIENT_SECRET: ci-only
      GOOGLE_CLIENT_ID: ci-only
      GOOGLE_CLIENT_SECRET: ci-only
      YOUTUBE_API_KEY: ci-only
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create empty CI environment file
        run: install -m 600 /dev/null .env

      - name: Check types
        run: just typecheck

      - name: Lint, format, and test
        run: just check

  publish:
    name: Publish production images
    needs:
      - resolve
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coldbrew:${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

      - name: Check for existing PostgreSQL WAL-G image
        id: postgres_image
        run: |
          if docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/coldbrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish PostgreSQL WAL-G image
        if: steps.postgres_image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/postgres-walg
          file: docker/postgres-walg/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coldbrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=postgres-walg
          cache-to: type=gha,mode=max,scope=postgres-walg

  deploy:
    name: Deploy to VPS
    needs:
      - resolve
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: Production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/coldbrew:${{ needs.resolve.outputs.sha }}
      DEPLOY_PATH: ${{ vars.SSH_DEPLOY_PATH }}
      POSTGRES_IMAGE: ghcr.io/${{ github.repository_owner }}/coldbrew-postgres-walg:${{ needs.resolve.outputs.postgres_tag }}
      REMOTE_ENV_FILE: .coldbrew-production-env-${{ github.run_id }}-${{ github.run_attempt }}
      SCHEMA_APPLIED: ${{ github.event_name == 'workflow_dispatch' && inputs.schema_applied || false }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/deploy_key"

      - name: Generate and upload production environment
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DONATION_ALERTS_CLIENT_ID: ${{ vars.DONATION_ALERTS_CLIENT_ID }}
          DONATION_ALERTS_CLIENT_SECRET: ${{ secrets.DONATION_ALERTS_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PGDATABASE: ${{ vars.PGDATABASE }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: ${{ vars.PGPORT }}
          PGUSER: ${{ vars.PGUSER }}
          WALG_ARCHIVE_TIMEOUT_SECONDS: ${{ vars.WALG_ARCHIVE_TIMEOUT_SECONDS }}
          WALG_BACKUP_INTERVAL_SECONDS: ${{ vars.WALG_BACKUP_INTERVAL_SECONDS }}
          WALG_KEEP_FULL_BACKUPS: ${{ vars.WALG_KEEP_FULL_BACKUPS }}
          WALG_S3_PREFIX: ${{ vars.WALG_S3_PREFIX }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node --input-type=module - "$RUNNER_TEMP/production.env" <<'NODE'
          import { writeFileSync } from "node:fs"

          const outputPath = process.argv[2]
          const required = [
            "APP_DOMAIN",
            "AWS_REGION",
            "AXIOM_TOKEN",
            "BETTER_AUTH_SECRET",
            "DONATION_ALERTS_CLIENT_ID",
            "DONATION_ALERTS_CLIENT_SECRET",
            "GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET",
            "PGDATABASE",
            "PGPASSWORD",
            "PGUSER",
            "WALG_S3_PREFIX",
            "YOUTUBE_API_KEY",
          ]
          const optional = [
            "AWS_ACCESS_KEY_ID",
            "AWS_ENDPOINT",
            "AWS_SECRET_ACCESS_KEY",
            "AWS_SESSION_TOKEN",
            "PGPORT",
            "WALG_ARCHIVE_TIMEOUT_SECONDS",
            "WALG_BACKUP_INTERVAL_SECONDS",
            "WALG_KEEP_FULL_BACKUPS",
          ]
          const missing = required.filter((name) => !process.env[name])

          if (missing.length > 0) {
            throw new Error(`Missing GitHub production configuration: ${missing.join(", ")}`)
          }

          const hasAccessKey = Boolean(process.env.AWS_ACCESS_KEY_ID)
          const hasSecretKey = Boolean(process.env.AWS_SECRET_ACCESS_KEY)
          if (hasAccessKey !== hasSecretKey) {
            throw new Error(
              "AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must either both be set or both be omitted",
            )
          }

          const encodeUrlPart = (value) => encodeURIComponent(value)
          const databaseUrl =
            `postgresql://${encodeUrlPart(process.env.PGUSER)}:` +
            `${encodeUrlPart(process.env.PGPASSWORD)}@postgres:5432/` +
            encodeUrlPart(process.env.PGDATABASE)
          const values = {
            ...Object.fromEntries(required.map((name) => [name, process.env[name]])),
            ...Object.fromEntries(
              optional.filter((name) => process.env[name]).map((name) => [name, process.env[name]]),
            ),
            DATABASE_URL: databaseUrl,
          }
          const quote = (value) => `'${value.replaceAll("'", "\\'")}'`
          const contents = Object.entries(values)
            .map(([name, value]) => `${name}=${quote(value)}`)
            .join("\n")

          writeFileSync(outputPath, `${contents}\n`, { encoding: "utf8", mode: 0o600 })
          NODE

          scp \
            -i "$RUNNER_TEMP/deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/production.env" \
            "$SSH_USER@$SSH_HOST:$REMOTE_ENV_FILE"

      - name: Deploy immutable images
        run: |
          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- \
              "$DEPLOY_PATH" \
              "$TARGET_SHA" \
              "$APP_IMAGE" \
              "$POSTGRES_IMAGE" \
              "$SCHEMA_APPLIED" \
              "$REMOTE_ENV_FILE" <<'REMOTE'
          set -euo pipefail

          deploy_path="$1"
          target_sha="$2"
          app_image="$3"
          postgres_image="$4"
          schema_applied="$5"
          production_env="$HOME/$6"

          cleanup() {
            rm -f "$production_env" "$deploy_path/.env.next"
          }
          trap cleanup EXIT

          export PATH="$HOME/.local/bin:$HOME/.bun/bin:$HOME/.cargo/bin:/usr/local/bin:$PATH"

          for command_name in git docker just bunx curl; do
            if ! command -v "$command_name" >/dev/null 2>&1; then
              echo "Required production command is unavailable: $command_name" >&2
              echo "Install it for the SSH user or place it in a standard user bin directory." >&2
              exit 127
            fi
          done
          docker compose version >/dev/null

          if [[ ! -f "$production_env" ]]; then
            echo "The uploaded production environment file is unavailable." >&2
            exit 1
          fi

          required_env=(
            APP_DOMAIN
            PGDATABASE
            PGUSER
            PGPASSWORD
            DATABASE_URL
            AXIOM_TOKEN
            BETTER_AUTH_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            DONATION_ALERTS_CLIENT_ID
            DONATION_ALERTS_CLIENT_SECRET
            YOUTUBE_API_KEY
            WALG_S3_PREFIX
            AWS_REGION
          )
          bunx dotenvx run -f "$production_env" --overload -- \
            bash -c '
              for name in "$@"; do
                if [[ -z "${!name:-}" ]]; then
                  echo "Generated production environment is missing required value: $name" >&2
                  exit 1
                fi
              done
            ' bash "${required_env[@]}"

          cd "$deploy_path"

          install -m 600 "$production_env" .env.next
          mv .env.next .env

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "The production checkout has tracked local changes; refusing to overwrite them." >&2
            exit 1
          fi

          git fetch --quiet --prune --tags origin
          git cat-file -e "${target_sha}^{commit}"

          previous_sha=""
          if [[ -f .deployed-sha ]]; then
            read -r previous_sha < .deployed-sha
            git cat-file -e "${previous_sha}^{commit}"
          fi

          schema_changed=true
          if [[ -n "$previous_sha" ]] && git diff --quiet "$previous_sha" "$target_sha" -- db/schema.sql; then
            schema_changed=false
          fi

          if [[ "$schema_changed" == true && "$schema_applied" != true ]]; then
            echo "db/schema.sql differs from the deployed revision." >&2
            echo "Apply the target schema on the VPS, then manually run this workflow" >&2
            echo "for revision $target_sha with schema_applied=true." >&2
            exit 42
          fi

          git checkout --quiet --detach "$target_sha"

          if just production-deploy "$app_image" "$postgres_image"; then
            printf '%s\n' "$target_sha" > .deployed-sha
            exit 0
          fi

          echo "Deployment failed health checks." >&2
          if [[ -n "$previous_sha" ]]; then
            echo "Rolling application containers back to $previous_sha." >&2
            git checkout --quiet --detach "$previous_sha"
            previous_postgres_tag="$(git rev-parse "${previous_sha}:docker/postgres-walg")"
            just production-deploy \
              "ghcr.io/lebedev-nikita/coldbrew:${previous_sha}" \
              "ghcr.io/lebedev-nikita/coldbrew-postgres-walg:${previous_postgres_tag}" || \
              echo "Automatic rollback also failed; inspect the VPS immediately." >&2
          else
            echo "No previous CI/CD deployment is recorded; automatic rollback is unavailable." >&2
          fi
          exit 1
          REMOTE

      - name: Remove uploaded environment file
        if: always()
        continue-on-error: true
        run: |
          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$REMOTE_ENV_FILE" <<'REMOTE'
          set -euo pipefail
          rm -f "$HOME/$1"
          REMOTE
