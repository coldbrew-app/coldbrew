name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p apps/web/tsconfig.node.json
      - run: bunx tsc --noEmit -p apps/web/tsconfig.json
      - run: bunx tsc --noEmit -p apps/donationalerts/tsconfig.json
      - run: bunx tsc --noEmit -p apps/video/tsconfig.json
      - run: bunx tsc --noEmit -p packages/tsconfig.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          APP_DOMAIN: ${{ secrets.DEPLOY_APP_DOMAIN }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/omnistream"
          scp -P "$DEPLOY_PORT" compose.yaml Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:/opt/omnistream/"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/omnistream && DOTENV_PRIVATE_KEY='$DOTENV_PRIVATE_KEY' APP_DOMAIN='$APP_DOMAIN' IMAGE_REF='$IMAGE_REF' docker compose pull && DOTENV_PRIVATE_KEY='$DOTENV_PRIVATE_KEY' APP_DOMAIN='$APP_DOMAIN' IMAGE_REF='$IMAGE_REF' docker compose up -d --remove-orphans"
