name: AWS infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan is read-only; apply reconciles AWS with Terraform
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions: {}

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: Production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_PROJECT_NAME: ${{ vars.AWS_PROJECT_NAME || 'streambrew' }}
      AWS_LIGHTSAIL_INSTANCE_NAME: ${{ vars.AWS_LIGHTSAIL_INSTANCE_NAME || 'Ubuntu-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_availability_zone: ${{ vars.AWS_LIGHTSAIL_AVAILABILITY_ZONE || 'eu-central-1a' }}
      TF_VAR_backup_bucket_name: ${{ vars.WALG_S3_BUCKET }}
      TF_VAR_blueprint_id: ${{ vars.AWS_LIGHTSAIL_BLUEPRINT_ID || 'ubuntu_24_04' }}
      TF_VAR_bundle_id: ${{ vars.AWS_LIGHTSAIL_BUNDLE_ID || 'medium_3_0' }}
      TF_VAR_instance_name: ${{ vars.AWS_LIGHTSAIL_INSTANCE_NAME || 'Ubuntu-1' }}
      TF_VAR_key_pair_name: ${{ vars.AWS_LIGHTSAIL_KEY_PAIR_NAME || 'id_rsa' }}
      TF_VAR_postgres_ingress_cidrs: ${{ vars.PG_INGRESS_CIDRS || '[]' }}
      TF_VAR_postgres_port: ${{ vars.PGPORT || '5432' }}
      TF_VAR_project_name: ${{ vars.AWS_PROJECT_NAME || 'streambrew' }}
      TF_VAR_snapshot_time_utc: ${{ vars.AWS_LIGHTSAIL_SNAPSHOT_TIME_UTC || '03:00' }}
      TF_VAR_ssh_ingress_cidrs: ${{ vars.SSH_INGRESS_CIDRS || '["0.0.0.0/0"]' }}
      TF_VAR_ssh_ingress_ipv6_cidrs: ${{ vars.SSH_INGRESS_IPV6_CIDRS || '["::/0"]' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: streambrew-infra-${{ github.run_id }}

      - name: Initialize Terraform
        run: |
          terraform -chdir=infra/aws init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$AWS_PROJECT_NAME/aws.tfstate" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan infrastructure
        run: terraform -chdir=infra/aws plan -input=false -out="$RUNNER_TEMP/aws.tfplan"

      - name: Apply infrastructure
        if: inputs.action == 'apply'
        run: terraform -chdir=infra/aws apply -input=false -auto-approve "$RUNNER_TEMP/aws.tfplan"

      - name: Verify the Lightsail host
        if: inputs.action == 'apply'
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          public_ip="$(terraform -chdir=infra/aws output -raw public_ip)"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/deploy_key"
          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -o BatchMode=yes \
            -o HostKeyAlias=streambrew-production \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            "ubuntu@$public_ip" \
            'cloud-init status --wait && docker info >/dev/null'

      - name: Publish infrastructure outputs
        if: inputs.action == 'apply'
        run: |
          {
            echo '### AWS production infrastructure'
            echo
            echo '| Output | Value |'
            echo '| --- | --- |'
            echo "| Lightsail instance | \`$(terraform -chdir=infra/aws output -raw instance_name)\` |"
            echo "| Public IP | \`$(terraform -chdir=infra/aws output -raw public_ip)\` |"
            echo "| WAL-G prefix | \`$(terraform -chdir=infra/aws output -raw walg_s3_prefix)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
