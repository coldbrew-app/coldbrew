name: Restream media plane

on:
  push:
    branches:
      - master
    paths:
      - apps/restream/**
      - internal/restream/**
      - infra/hetzner/**
      - .github/workflows/restream.yml
      - go.mod
      - go.sum
  workflow_dispatch:
    inputs:
      revision:
        description: Commit, branch, or tag to deploy
        required: true
        default: master
        type: string

permissions: {}

jobs:
  resolve:
    name: Resolve revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Record commit SHA
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: CI
    if: github.event_name == 'workflow_dispatch'
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.resolve.outputs.sha }}

  publish:
    name: Publish restream media image
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (github.event_name == 'push' || needs.quality.result == 'success')
    needs:
      - resolve
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/hetzner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/streambrew-restream:${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=restream-media
          cache-to: type=gha,mode=max,scope=restream-media,timeout=1m,ignore-error=true

  deploy:
    name: Deploy restream media plane
    needs:
      - resolve
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: Production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      HCLOUD_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/streambrew-restream:${{ needs.resolve.outputs.sha }}
      SERVER_NAME: ${{ vars.HETZNER_RESTREAM_SERVER }}
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install hcloud
        uses: hetznercloud/setup-hcloud@28cdd3fc4a4a8013e86d57c7254be72df92fcc02 # v2
        with:
          hcloud-version: v1.68.0

      - name: Resolve server with hcloud
        run: |
          set -euo pipefail
          server_ip="$(hcloud server describe "$SERVER_NAME" -o json | jq -r '.public_net.ipv4.ip')"
          if [[ ! "$server_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Hetzner server has no public IPv4 address" >&2
            exit 1
          fi
          echo "SERVER_IP=$server_ip" >> "$GITHUB_ENV"

      - name: Configure strict SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/restream_deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/restream_deploy_key"
          cat > "$HOME/.ssh/config" <<SSH_CONFIG
          Host streambrew-restream
            HostName $SERVER_IP
            User streambrew
            HostKeyAlias streambrew-restream
            IdentityFile $RUNNER_TEMP/restream_deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ServerAliveInterval 30
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
          SSH_CONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Generate runtime environment
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          RESTREAM_MEDIA_SHARED_SECRET: ${{ secrets.RESTREAM_MEDIA_SHARED_SECRET }}
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/restream.env" <<'NODE'
          import { writeFileSync } from "node:fs"

          const outputPath = process.argv[2]
          const required = ["IMAGE", "APP_DOMAIN", "RESTREAM_MEDIA_SHARED_SECRET"]
          const missing = required.filter((name) => !process.env[name])
          if (missing.length > 0) {
            throw new Error(`Missing restream deployment configuration: ${missing.join(", ")}`)
          }
          const values = {
            RESTREAM_MEDIA_IMAGE: process.env.IMAGE,
            RESTREAM_NODE_ID: "nbg1-1",
            RESTREAM_CONTROL_URL: `${process.env.APP_DOMAIN.replace(/\/$/, "")}/api/restream/media`,
            RESTREAM_MEDIA_SHARED_SECRET: process.env.RESTREAM_MEDIA_SHARED_SECRET,
          }
          const quote = (value) => `'${value.replaceAll("'", "'\\''")}'`
          const contents = Object.entries(values)
            .map(([name, value]) => `${name}=${quote(value)}`)
            .join("\n")
          writeFileSync(outputPath, `${contents}\n`, { encoding: "utf8", mode: 0o600 })
          NODE

      - name: Deploy immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'ssh streambrew-restream docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | ssh streambrew-restream \
            docker login ghcr.io --username '${{ github.actor }}' --password-stdin
          scp infra/hetzner/compose.yml streambrew-restream:/opt/streambrew-restream/compose.yml
          scp "$RUNNER_TEMP/restream.env" streambrew-restream:/opt/streambrew-restream/runtime.env
          ssh streambrew-restream sh -s <<'REMOTE'
          set -eu
          cd /opt/streambrew-restream
          chmod 600 runtime.env
          docker compose --env-file runtime.env -f compose.yml pull
          docker compose --env-file runtime.env -f compose.yml up --detach --wait --wait-timeout 120 --remove-orphans
          docker image prune --force --filter 'until=168h'
          REMOTE

      - name: Verify RTMP listener
        run: timeout 15 bash -c "until (echo > /dev/tcp/${SERVER_IP}/1935) 2>/dev/null; do sleep 1; done"
