x-app: &app
  image: ${COLDBREW_IMAGE:-coldbrew:local}
  env_file:
    - .env

  init: true
  restart: unless-stopped
  networks:
    - internal
  depends_on:
    postgres:
      condition: service_healthy

x-wal-g-environment: &wal-g-environment
  WALG_S3_PREFIX: ${WALG_S3_PREFIX:?Set WALG_S3_PREFIX in .env}
  AWS_REGION: ${AWS_REGION:?Set AWS_REGION in .env}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}

services:
  postgres:
    build:
      context: ./docker/postgres-walg
    image: ${COLDBREW_POSTGRES_IMAGE:-coldbrew-postgres-walg:local}
    environment:
      <<: *wal-g-environment
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
      POSTGRES_USER: ${PGUSER:?Set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    command:
      [
        "postgres",
        "-c",
        "wal_level=replica",
        "-c",
        "archive_mode=on",
        "-c",
        "archive_command=/usr/local/bin/wal-g wal-push %p",
        "-c",
        "archive_timeout=${WALG_ARCHIVE_TIMEOUT_SECONDS:-300}",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores its cluster in a version-specific subdirectory.
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - internal

  wal-g:
    image: ${COLDBREW_POSTGRES_IMAGE:-coldbrew-postgres-walg:local}
    # This image is built by the postgres service in this Compose project.
    # Never fall back to a registry while that local build is being created.
    pull_policy: never
    environment:
      <<: *wal-g-environment
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      WALG_BACKUP_INTERVAL_SECONDS: ${WALG_BACKUP_INTERVAL_SECONDS:-86400}
      WALG_KEEP_FULL_BACKUPS: ${WALG_KEEP_FULL_BACKUPS:-7}
    command: ["/usr/local/bin/backup-scheduler", "/var/lib/postgresql/18/docker"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    volumes:
      # WAL-G performs local physical backups from a read-only view of PGDATA.
      - postgres_data:/var/lib/postgresql:ro

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - internal
    mem_limit: 128m
    cpus: 0.25

  web:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/apps/web
    command: ["bun", "/app/apps/web/.output/server/index.mjs"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e ''fetch("http://127.0.0.1:3000/api/health").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))''',
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 0.75

  donationalerts:
    <<: *app
    command: ["bun", "apps/donationalerts/src/index.ts"]
    mem_limit: 384m
    cpus: 0.5

  video:
    <<: *app
    command: ["bun", "apps/video/src/index.ts"]
    mem_limit: 256m
    cpus: 0.5

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
